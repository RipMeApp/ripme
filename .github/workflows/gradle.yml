name: CI + release

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        java: [26]
        include: # test old java on one os only, upload from ubuntu java-21
          - os: ubuntu-latest
            java: 21
            upload: true

    steps:

    - uses: actions/checkout@v1

    - name: Set environment CI_ variables
      id: ci-env
      uses: FranzDiebold/github-env-vars-action@v2

    - name: Set up java
      uses: actions/setup-java@v4.2.1
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: gradle

    - name: Build with Gradle
      run: gradle clean build -PjavacRelease=${{ matrix.java }}

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'

    - name: SHA256
      if: matrix.upload
      run: shasum -a 256 build/libs/*.jar

    - name: upload jar as asset
      if: matrix.upload
      uses: actions/upload-artifact@v4
      with:
        name: zipped-ripme-jar
        path: build/libs/*.jar

    - name: create pre-release
      id: create-pre-release
      if: matrix.upload && github.ref == 'refs/heads/main'
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest-${{ env.CI_REF_NAME_SLUG  }}"
        prerelease: true
        title: "development build ${{ env.CI_REF_NAME }}"
        files: |
            build/libs/*.jar

