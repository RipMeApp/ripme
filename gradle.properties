# Java compiles for --release 25 (see build.gradle.kts / -PjavacRelease) while the
# Kotlin sources under src/main/kotlin (Compose Desktop GUI) target JVM 21 because
# jvmTarget can't currently be set to 25 and we deliberately avoid a Kotlin/Java
# toolchain (which would trigger JDK auto-provisioning). This mismatch is benign -
# Kotlin bytecode targeting 21 runs fine on the release-25 JVM the app is built
# with - so relax the validation from an error to a warning.
kotlin.jvm.target.validation.mode=warning
